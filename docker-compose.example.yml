services:
  immich-compress:
    build: .
    container_name: immich_compress
    restart: unless-stopped
    ports:
      - "8097:8097"
    gpus: all
    environment:
      IMMICH_UPLOAD_ROOT: "/immich-upload"
      NVIDIA_DRIVER_CAPABILITIES: "compute,video,utility"
      IOS_REPAIR_ENCODER: "h264_nvenc"
      IOS_REPAIR_CQ: "19"
      # Connection and compression settings are configured in the web UI.
    volumes:
      - ./immich-compress-data:/data
      - ${UPLOAD_LOCATION}:/immich-upload
